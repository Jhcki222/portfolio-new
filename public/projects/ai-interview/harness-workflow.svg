<text x="440" y="56">자기소개서·JD 입력 → 경험과 근거 확인</text>
<text x="440" y="130">질문 생성 → 텍스트·음성 답변</text>
<text x="440" y="204">모델이 5개 지표의 점수와 근거 반환</text>
<text x="440" y="281">Python 하네스가 응답을 검증하고 분기</text>
<text x="157" y="375">꼬리질문 제안</text><text x="440" y="375">다음 질문 제안</text><text x="723" y="375">종합 평가 제안</text>
<text x="440" y="487">사용자가 확인하면 제안 실행</text>
</g>
<g text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="13" fill="#514970">
<text x="157" y="397">최저 점수 70점 미만 · 2회 미만</text><text x="440" y="397">남은 질문 있음 · 꼬리질문 조건 미충족</text><text x="723" y="397">남은 질문 없음 또는 턴 한도</text>
<text x="440" y="508">질문이면 다시 답변하고, 종료면 피드백 확인</text>
